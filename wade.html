<style>
  :root{
    --navy-deep:#05162D;
    --navy:#0A1A30;
    --navy-light:#182436;
    --orange:#E06D00;
    --orange-hover:#C55F00;
    --white:#FFFFFF;
    --text-muted:#B7C0CC;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    background:var(--navy-deep);
    color:var(--white);
    font-family:'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }

  .page{
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:24px 16px 48px;
  }

  .card{
    position:relative;
    width:100%;
    max-width:440px;
    background:linear-gradient(180deg, var(--navy) 0%, var(--navy-deep) 55%, var(--navy-deep) 100%);
    border-radius:32px;
    overflow:hidden;
    box-shadow:0 30px 80px rgba(0,0,0,0.45), 0 0 0 1px rgba(224,109,0,0.15);
  }

  /* Header / hero zone */
  .card-hero{
    position:relative;
    padding:36px 28px 0;
    text-align:center;
    overflow:hidden;
  }

  .hero-bg-image{
    position:absolute;
    inset:0;
    width:100%;
    height:230px;
    object-fit:cover;
    opacity:0.55;
    -webkit-mask-image:linear-gradient(180deg, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.5) 70%, rgba(0,0,0,0) 100%);
    mask-image:linear-gradient(180deg, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.5) 70%, rgba(0,0,0,0) 100%);
  }

  .hero-arc{
    position:absolute;
    left:-10%;
    right:-10%;
    top:205px;
    height:120px;
    border-top:2px solid var(--orange);
    border-radius:50%;
    opacity:0.9;
  }

  .card-logo{
    position:relative;
    z-index:2;
    width:min(78%, 300px);
    height:auto;
    margin:0 auto 6px;
    display:block;
  }

  .headshot-wrap{
    position:relative;
    z-index:2;
    width:172px;
    height:172px;
    margin:22px auto 0;
    border-radius:50%;
    border:4px solid var(--orange);
    box-shadow:0 8px 30px rgba(224,109,0,0.35);
    overflow:hidden;
    background:var(--navy);
  }

  .headshot-wrap img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  /* Name block */
  .identity{
    position:relative;
    z-index:2;
    text-align:center;
    padding:20px 28px 0;
  }

  .identity .first-name{
    display:block;
    font-size:34px;
    font-weight:800;
    color:var(--orange);
    letter-spacing:0.5px;
    line-height:1.05;
    text-transform:uppercase;
  }

  .identity .last-name{
    display:block;
    font-size:40px;
    font-weight:800;
    color:var(--white);
    letter-spacing:0.5px;
    line-height:1.1;
    text-transform:uppercase;
    margin-top:2px;
  }

  .identity .divider{
    width:56px;
    height:3px;
    background:var(--orange);
    border-radius:2px;
    margin:14px auto 14px;
  }

  .identity .title{
    font-size:14px;
    font-weight:600;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--text-muted);
  }

  /* Contact rows */
  .contact-list{
    position:relative;
    z-index:2;
    margin:26px 28px 0;
    display:flex;
    flex-direction:column;
  }

  .contact-row{
    display:flex;
    align-items:center;
    gap:14px;
    padding:14px 0;
    border-bottom:1px solid rgba(255,255,255,0.08);
    text-decoration:none;
    color:var(--white);
  }

  .contact-row:last-child{
    border-bottom:none;
  }

  .contact-icon{
    flex:0 0 auto;
    width:36px;
    height:36px;
    border-radius:50%;
    border:2px solid var(--orange);
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--orange);
  }

  .contact-icon svg{
    width:16px;
    height:16px;
  }

  .contact-text{
    font-size:16px;
    font-weight:600;
    letter-spacing:0.2px;
    word-break:break-word;
  }

  /* QR section */
  .qr-section{
    position:relative;
    z-index:2;
    margin:30px 28px 0;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .qr-box{
    width:150px;
    height:150px;
    background:var(--white);
    border-radius:16px;
    border:3px solid var(--orange);
    padding:10px;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .qr-box img{
    width:100%;
    height:100%;
    display:block;
  }

  .qr-label{
    margin-top:10px;
    font-size:13px;
    font-weight:700;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--orange);
  }

  /* Action buttons */
  .actions{
    position:relative;
    z-index:2;
    margin:30px 24px 0;
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .btn{
    display:flex;
    align-items:center;
    gap:16px;
    width:100%;
    border-radius:16px;
    padding:16px 20px;
    text-decoration:none;
    cursor:pointer;
    font-family:inherit;
    text-align:left;
    transition:transform 0.15s ease, filter 0.15s ease;
  }

  .btn:active{
    transform:scale(0.98);
  }

  .btn-primary{
    background:linear-gradient(135deg, var(--orange) 0%, #F39416 100%);
    border:none;
    color:var(--white);
    box-shadow:0 10px 24px rgba(224,109,0,0.35);
  }

  .btn-outline{
    background:transparent;
    border:2px solid var(--orange);
    color:var(--white);
  }

  .btn-icon{
    flex:0 0 auto;
    width:26px;
    height:26px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:inherit;
  }

  .btn-icon svg{
    width:24px;
    height:24px;
  }

  .btn-text{
    flex:1 1 auto;
    min-width:0;
  }

  .btn-title{
    font-size:14px;
    font-weight:800;
    letter-spacing:0.3px;
    text-transform:uppercase;
    display:block;
    white-space:nowrap;
  }

  @media (max-width:360px){
    .btn-title{
      font-size:13px;
    }
  }

  .btn-subtitle{
    font-size:12px;
    font-weight:500;
    opacity:0.85;
    display:block;
    margin-top:2px;
  }

  .btn-chevron{
    flex:0 0 auto;
    width:18px;
    height:18px;
    opacity:0.85;
  }

  .call-text-row{
    display:flex;
    gap:12px;
  }

  .call-text-row .btn{
    flex:1 1 50%;
    justify-content:center;
    text-align:center;
  }

  .call-text-row .btn-text{
    flex:0 0 auto;
  }

  /* Closing line */
  .closing{
    position:relative;
    z-index:2;
    margin:34px 28px 8px;
    text-align:center;
  }

  .closing-divider{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    margin-bottom:16px;
  }

  .closing-divider .line{
    height:1px;
    width:56px;
    background:rgba(224,109,0,0.5);
  }

  .closing-divider .bubble{
    width:26px;
    height:26px;
    border-radius:8px;
    background:var(--orange);
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .closing-divider .bubble svg{
    width:14px;
    height:14px;
    fill:var(--navy-deep);
  }

  .closing p{
    margin:0;
    font-size:13px;
    line-height:1.7;
    letter-spacing:0.3px;
    text-transform:uppercase;
    color:var(--text-muted);
    font-weight:600;
  }

  .closing .highlight{
    color:var(--orange);
  }

  .card-footer-space{
    height:32px;
  }

  .toast{
    position:fixed;
    left:50%;
    bottom:28px;
    transform:translateX(-50%) translateY(20px);
    background:var(--orange);
    color:var(--white);
    font-weight:700;
    font-size:14px;
    padding:12px 22px;
    border-radius:999px;
    box-shadow:0 10px 30px rgba(0,0,0,0.35);
    opacity:0;
    pointer-events:none;
    transition:opacity 0.25s ease, transform 0.25s ease;
    z-index:50;
    white-space:nowrap;
  }

  .toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }

  @media (min-width:480px){
    .page{
      padding:48px 16px 64px;
    }
    .card{
      max-width:400px;
    }
  }
</style>
</head>

<div class="toast" id="toast" role="status" aria-live="polite">Card link copied.</div>

<script>
  (function(){
    var CARD_URL = "https://solveframework.com/wade";
    var VCF_URL = "/wade.vcf";

    function showToast(msg){
      var t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(function(){ t.classList.remove('show'); }, 2400);
    }

    document.getElementById('btn-add-contacts').addEventListener('click', function(){
      var link = document.createElement('a');
      link.href = VCF_URL;
      link.download = 'wade-skrimager.vcf';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    });

    document.getElementById('btn-share-card').addEventListener('click', function(){
      if (navigator.share) {
        navigator.share({
          title: 'Wade Skrimager | SOLVE Framework',
          text: 'Here is my SOLVE Framework digital card.',
          url: CARD_URL
        }).catch(function(){ /* user cancelled, no-op */ });
      } else if (navigator.clipboard) {
        navigator.clipboard.writeText(CARD_URL).then(function(){
          showToast('Card link copied.');
        }).catch(function(){
          showToast(CARD_URL);
        });
      } else {
        showToast(CARD_URL);
      }
    });
  })();
</script>
