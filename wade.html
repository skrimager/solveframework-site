<style>
  :root{
    --navy-deep:#05162D;
    --navy:#0A1A30;
    --navy-light:#182436;
    --orange:#FF7A1A;
    --orange-hover:#E8690D;
    --white:#FFFFFF;
    --text-muted:#B7C0CC;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    background:var(--navy-deep);
    color:var(--white);
    font-family:'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }

  .page{
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:24px 16px 48px;
  }

  .card{
    position:relative;
    width:100%;
    max-width:440px;
    background:linear-gradient(180deg, var(--navy) 0%, var(--navy-deep) 55%, var(--navy-deep) 100%);
    border-radius:32px;
    overflow:hidden;
    box-shadow:0 30px 80px rgba(0,0,0,0.45), 0 0 0 1px rgba(224,109,0,0.15);
  }

  /* Header / hero zone */
  .card-hero{
    position:relative;
    padding:36px 28px 0;
    text-align:center;
    overflow:hidden;
  }

  .hero-bg-image{
    position:absolute;
    inset:0;
    width:100%;
    height:340px;
    object-fit:cover;
    object-position:center top;
    opacity:0.85;
    -webkit-mask-image:linear-gradient(180deg, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.75) 55%, rgba(0,0,0,0) 100%);
    mask-image:linear-gradient(180deg, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.75) 55%, rgba(0,0,0,0) 100%);
  }

  .hero-dots{
    position:absolute;
    top:0;
    right:-4%;
    width:38%;
    height:520px;
    opacity:0.85;
    pointer-events:none;
    z-index:1;
  }

  .hero-arc{
    position:absolute;
    left:-15%;
    right:-15%;
    top:290px;
    height:150px;
    border-top:3px solid var(--orange);
    border-radius:50%;
    opacity:1;
    z-index:2;
  }

  .card-logo{
    position:relative;
    z-index:2;
    width:min(78%, 300px);
    height:auto;
    margin:0 auto 6px;
    display:block;
  }

  .headshot-wrap{
    position:relative;
    z-index:2;
    width:190px;
    height:190px;
    margin:26px auto 0;
    border-radius:50%;
    border:5px solid var(--orange);
    box-shadow:0 8px 30px rgba(224,109,0,0.35);
    overflow:hidden;
    background:#FFFFFF;
  }

  .headshot-wrap img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  /* Name block */
  .identity{
    position:relative;
    z-index:2;
    text-align:center;
    padding:20px 28px 0;
  }

  .identity .first-name{
    display:block;
    font-size:34px;
    font-weight:800;
    color:var(--orange);
    letter-spacing:0.5px;
    line-height:1.05;
    text-transform:uppercase;
  }

  .identity .last-name{
    display:block;
    font-size:40px;
    font-weight:800;
    color:var(--white);
    letter-spacing:0.5px;
    line-height:1.1;
    text-transform:uppercase;
    margin-top:2px;
  }

  .identity .divider{
    width:56px;
    height:3px;
    background:var(--orange);
    border-radius:2px;
    margin:14px auto 14px;
  }

  .identity .title{
    font-size:14px;
    font-weight:600;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--text-muted);
  }

  /* Contact rows */
  .contact-list{
    position:relative;
    z-index:2;
    margin:26px 28px 0;
    display:flex;
    flex-direction:column;
  }

  .contact-row{
    display:flex;
    align-items:center;
    gap:14px;
    padding:14px 0;
    border-bottom:1px solid rgba(255,255,255,0.08);
    text-decoration:none;
    color:var(--white);
  }

  .contact-row:last-child{
    border-bottom:none;
  }

  .contact-icon{
    flex:0 0 auto;
    width:36px;
    height:36px;
    border-radius:50%;
    border:2px solid var(--orange);
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--orange);
  }

  .contact-icon svg{
    width:16px;
    height:16px;
  }

  .contact-text{
    font-size:16px;
    font-weight:600;
    letter-spacing:0.2px;
    word-break:break-word;
  }

  /* QR section */
  .qr-section{
    position:relative;
    z-index:2;
    margin:30px 28px 0;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:18px;
  }

  .qr-box{
    flex:0 0 auto;
    width:150px;
    height:150px;
    background:var(--white);
    border-radius:16px;
    border:3px solid var(--orange);
    padding:10px;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .qr-box img{
    width:100%;
    height:100%;
    display:block;
  }

  .qr-caption{
    flex:0 0 auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    width:74px;
  }

  .qr-label{
    font-family:'Segoe Script', 'Brush Script MT', cursive;
    font-style:italic;
    font-size:19px;
    font-weight:400;
    line-height:1.25;
    text-align:center;
    color:var(--orange);
  }

  .qr-arrow{
    width:44px;
    height:34px;
    margin-top:4px;
    color:var(--orange);
  }

  /* Action buttons */
  .actions{
    position:relative;
    z-index:2;
    margin:30px 24px 0;
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .btn{
    display:flex;
    align-items:center;
    gap:16px;
    width:100%;
    border-radius:16px;
    padding:16px 20px;
    text-decoration:none;
    cursor:pointer;
    font-family:inherit;
    text-align:left;
    transition:transform 0.15s ease, filter 0.15s ease;
  }

  .btn:active{
    transform:scale(0.98);
  }

  .btn-primary{
    background:linear-gradient(135deg, var(--orange) 0%, #F39416 100%);
    border:none;
    color:var(--white);
    box-shadow:0 10px 24px rgba(224,109,0,0.35);
  }

  .btn-outline{
    background:transparent;
    border:2px solid var(--orange);
    color:var(--white);
  }

  .btn-icon{
    flex:0 0 auto;
    width:38px;
    height:38px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:inherit;
  }

  .btn-icon svg{
    width:22px;
    height:22px;
  }

  .btn-outline .btn-icon{
    background:rgba(255,122,26,0.16);
    color:var(--orange);
    box-shadow:inset 0 0 0 1.5px rgba(255,122,26,0.4);
  }

  .btn-primary .btn-icon{
    background:rgba(255,255,255,0.22);
  }

  .btn-text{
    flex:1 1 auto;
    min-width:0;
  }

  .btn-title{
    font-size:14px;
    font-weight:800;
    letter-spacing:0.3px;
    text-transform:uppercase;
    display:block;
    white-space:nowrap;
  }

  @media (max-width:360px){
    .btn-title{
      font-size:13px;
    }
  }

  .btn-subtitle{
    font-size:12px;
    font-weight:500;
    opacity:0.85;
    display:block;
    margin-top:2px;
  }

  .btn-chevron{
    flex:0 0 auto;
    width:18px;
    height:18px;
    opacity:0.85;
  }

  .call-text-wrap{
    position:relative;
  }

  .call-text-menu{
    position:relative;
    margin-top:8px;
    background:var(--navy-light);
    border:2px solid var(--orange);
    border-radius:14px;
    overflow:hidden;
    max-height:0;
    display:block;
    z-index:5;
    box-shadow:0 12px 28px rgba(0,0,0,0.4);
    transition:max-height 0.25s ease;
  }

  .call-text-menu.open{
    max-height:120px;
  }

  .call-text-menu a{
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px 20px;
    color:var(--white);
    text-decoration:none;
    font-size:15px;
    font-weight:700;
    letter-spacing:0.3px;
    text-transform:uppercase;
  }

  .call-text-menu a svg{
    width:18px;
    height:18px;
    color:var(--orange);
  }

  .call-text-menu a:not(:last-child){
    border-bottom:1px solid rgba(255,255,255,0.08);
  }

  /* Closing line */
  .closing{
    position:relative;
    z-index:2;
    margin:34px 28px 8px;
    text-align:center;
  }

  .closing-divider{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    margin-bottom:16px;
  }

  .closing-divider .line{
    height:1px;
    width:56px;
    background:rgba(224,109,0,0.5);
  }

  .closing-divider .bubble{
    width:26px;
    height:26px;
    border-radius:8px;
    background:var(--orange);
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .closing-divider .bubble svg{
    width:14px;
    height:14px;
    fill:var(--navy-deep);
  }

  .closing p{
    margin:0;
    font-size:13px;
    line-height:1.7;
    letter-spacing:0.3px;
    text-transform:uppercase;
    color:var(--text-muted);
    font-weight:600;
  }

  .closing .highlight{
    color:var(--orange);
  }

  .card-footer-space{
    height:32px;
  }

  .toast{
    position:fixed;
    left:50%;
    bottom:28px;
    transform:translateX(-50%) translateY(20px);
    background:var(--orange);
    color:var(--white);
    font-weight:700;
    font-size:14px;
    padding:12px 22px;
    border-radius:999px;
    box-shadow:0 10px 30px rgba(0,0,0,0.35);
    opacity:0;
    pointer-events:none;
    transition:opacity 0.25s ease, transform 0.25s ease;
    z-index:50;
    white-space:nowrap;
  }

  .toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }

  @media (min-width:480px){
    .page{
      padding:48px 16px 64px;
    }
    .card{
      max-width:400px;
    }
  }
</style>
</head>

<div class="toast" id="toast" role="status" aria-live="polite">Card link copied.</div>

<script>
  (function(){
    var CARD_URL = "https://solveframework.com/wade";
    var VCF_URL = "/wade.vcf";

    var callTextBtn = document.getElementById('btn-call-or-text');
    var callTextMenu = document.getElementById('call-text-menu');
    if (callTextBtn && callTextMenu){
      callTextBtn.addEventListener('click', function(e){
        e.stopPropagation();
        var isOpen = callTextMenu.classList.toggle('open');
        callTextBtn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
      });
      document.addEventListener('click', function(e){
        if (!callTextMenu.contains(e.target) && e.target !== callTextBtn){
          callTextMenu.classList.remove('open');
          callTextBtn.setAttribute('aria-expanded', 'false');
        }
      });
    }

    function showToast(msg){
      var t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(function(){ t.classList.remove('show'); }, 2400);
    }

    document.getElementById('btn-add-contacts').addEventListener('click', function(){
      var link = document.createElement('a');
      link.href = VCF_URL;
      link.download = 'wade-skrimager.vcf';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    });

    document.getElementById('btn-share-card').addEventListener('click', function(){
      if (navigator.share) {
        navigator.share({
          title: 'Wade Skrimager | SOLVE Framework',
          text: 'Here is my SOLVE Framework digital card.',
          url: CARD_URL
        }).catch(function(){ /* user cancelled, no-op */ });
      } else if (navigator.clipboard) {
        navigator.clipboard.writeText(CARD_URL).then(function(){
          showToast('Card link copied.');
        }).catch(function(){
          showToast(CARD_URL);
        });
      } else {
        showToast(CARD_URL);
      }
    });
  })();
</script>
